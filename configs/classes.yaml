# ==================================================
# 조각김치 이물검출 라벨링 프로그램 - Class · 작업자 · scene_type · review_reason 설정
# ==================================================
# 이 파일은 문서가 아니라 프로그램이 실제로 읽어 사용하는 설정 파일입니다.
#   - 숫자(0, 1, 2 ...) = YOLO class_id  →  0부터 빈칸 없이 이어져야 합니다.
#   - name    : 화면에 보이는 이름
#   - enabled : false 면 선택할 수 없고, 이 Class 가 남아 있으면 FINAL 로 넘어가지 않습니다.
#   - color   : (선택) "#RRGGBB". 안 쓰면 프로그램 기본 색을 씁니다.

classes:
  0:
    name: "나뭇잎·종이류"
    enabled: true

  1:
    name: "플라스틱류·돌·금속류"
    enabled: true

  2:
    name: "나뭇가지류"
    enabled: true

  3:
    name: "벌레류"
    enabled: true

  4:
    name: "고무장갑"
    enabled: false

  5:
    name: "병해·갈변"
    enabled: true

  6:
    name: "파·고추"
    enabled: true

# ==================================================
# 프로그램 설정
# ==================================================

# 작업자 / 검수자로 고를 수 있는 이름 (둘 다 같은 목록에서 고릅니다)
#   - 작업자(1차 검수) : data/work 에만 저장 (DONE / EDITED / REVIEW)
#   - 검수자(교차검수) : QA PASS → data/final, 또는 반려(REVIEW) → data/work
members:
  - "최용훈"
  - "박건"
  - "이승훈"
  - "김하민"
  - "심준형"

# scene_type : YOLO Class 가 아닙니다!  (교과7 7번 Dataset Manifest 기준)
#   BBox 하나하나가 아니라 '이미지 전체가 어떤 형태인지' 기록하는 보조 정보입니다.
#   TXT 에는 들어가지 않고 manifests/dataset_manifest.csv 에만 기록됩니다.
scene_types:
  kimchi_with_target: "김치 + 검출 대상 객체"
  normal_kimchi: "정상 김치 (검출 대상 없음)"
  object_only: "대상 객체만 단독으로 있는 이미지"
  other_review: "바로 분류하기 어려운 이미지"

# review_reason : status 가 REVIEW 일 때 반드시 하나를 고릅니다.  (docs/class_guide.md · bbox_guide.md 기준)
review_reasons:
  class_ambiguous: "Class 판단이 애매함"
  bbox_boundary_ambiguous: "BBox 경계가 애매함"
  object_separation_ambiguous: "겹친 객체를 나누기 애매함"
  too_small_to_identify: "너무 작아서 식별이 어려움"
  occlusion_ambiguous: "가려져서 판단이 어려움"
  unused_class_found: "사용하지 않는 Class(4 고무장갑) 발견 - 임의 삭제 금지"

# 팀 작업 규칙
rules:
  allow_self_review: false     # false = 본인이 1차 검수한 이미지는 본인이 QA PASS 못 함 (교차검수)
  golden_test_size: 20         # Golden Test 에 쓸 이미지 수
  pilot_test_size: 50          # Pilot Test 에 쓸 이미지 수
